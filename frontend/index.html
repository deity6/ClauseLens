<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 主题要在首帧之前定下来，否则会先闪一下浅色再变深。
         线上 CSP 是 script-src 'self'，内联脚本必须带 hash 才不被拦——hash 由 scripts/csp-hash.mjs 在
         每次 build 前按下面这段脚本自动写进 public/_headers（改脚本 => 构建会重算，别手改 _headers）。
         为什么不用外链脚本：它是 <head> 里的阻塞请求，在国内到 CF 边缘的链路上要多付 1~2 秒才开画。
         优先级：用户手动选过（localStorage）> 移动端跟随系统深浅色 > 桌面浅色。
         <html> 上不写死 data-theme：浅色本来就是 CSS 默认值，写死会让「脚本没跑成」和「算出来就是浅色」
         分不开——React 侧会把这个值当成已有结论直接沿用（见 src/lib/theme.js 的 getTheme）。 -->
    <!-- theme-boot:start -->
    <script>
(function () {
  try {
    var THEMES = ["light", "geek"];
    var t = null;
    try {
      t = localStorage.getItem("cl:theme");
    } catch (e) {
      t = null;
    }
    if (THEMES.indexOf(t) < 0) {
      var mm = window.matchMedia ? window.matchMedia.bind(window) : null;
      var ua = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|MiuiBrowser/i.test(navigator.userAgent || "");
      var coarse = mm ? mm("(pointer: coarse)").matches : false;
      var sc = window.screen || {};
      var shortSide = Math.min(sc.width || 0, sc.height || 0);
      var mobile = ua || (coarse && shortSide > 0 && shortSide <= 900);
      var dark = mm ? mm("(prefers-color-scheme: dark)").matches : false;
      t = mobile && dark ? "geek" : "light";
    }
    var root = document.documentElement;
    root.setAttribute("data-theme", t);
    root.setAttribute("data-theme-boot", t);
    root.style.colorScheme = t === "geek" ? "dark" : "light";
  } catch (e) {
    /* 任何异常都退回 CSS 默认的浅色，不阻塞页面 */
  }
})();
    </script>
    <!-- theme-boot:end -->
    <title>ClauseLens 条款透镜 · 注册前，先看看你同意了什么</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%23c2412d' stroke-width='3'/%3E%3Cpath d='M21 21l7 7' stroke='%23c2412d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
